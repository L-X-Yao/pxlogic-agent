name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-24.04, python: "3.9" }  # setup-python has no 3.9 build for Ubuntu 26.04
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit tests (no hardware)
        run: python -m unittest discover -s tests -v
      - name: CLI entry point
        run: pxlogic-agent --help
