[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pxlogic-agent"
version = "0.1.0rc1"
description = "PX Logic logic-analyzer toolkit for AI agents: capture, frequency measurement and UART/SPI/I2C decoding via the pxlobster CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "L-X-Yao" }]
requires-python = ">=3.9"
dependencies = ["numpy"]
keywords = ["logic-analyzer", "pxlogic", "ai-agent", "uart", "spi", "i2c"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/L-X-Yao/pxlogic-agent"
Issues = "https://github.com/L-X-Yao/pxlogic-agent/issues"

[project.scripts]
pxlogic-agent = "px_logic:main"

[tool.setuptools]
py-modules = ["px_logic"]
